name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the remaining dependencies
        run: python -m pip install -r requirements.txt ruff==0.12.0

      - name: Lint
        run: ruff check .

      - name: Test
        # FNC-1 data and model weights are not in git, so tests that need them
        # skip themselves (see tests/_markers.py). -rs prints the reasons.
        run: python -m pytest -m "not gpu and not slow" -rs -q
