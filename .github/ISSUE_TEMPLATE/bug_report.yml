name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, and the headline/article text if it is a prediction problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. v1.0.0 or a commit hash"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, `pip freeze | findstr -i "torch transformers streamlit"`, and CPU or GPU.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
